<main>
  <div class="text-xs absolute left-1/2 -translate-x-1/2 p-1 flex flex-row items-center gap-2 z-10 justify-center">
    <app-search style="-webkit-app-region: no-drag;"></app-search>
    <button
      type="button"
      style="-webkit-app-region: no-drag;"
      class="h-7 w-7 flex items-center justify-center rounded-md bg-zinc-925 border border-zinc-700 text-white hover:border-white transition-colors disabled:cursor-wait disabled:opacity-60"
      [disabled]="isRefreshing()"
      title="Recarregar componentes (F5)"
      aria-label="Recarregar componentes (F5)"
      (click)="refreshComponents()">
      <i
        class="fa-solid fa-rotate-right text-xs"
        [class.fa-spin]="isRefreshing()">
      </i>
    </button>
    <app-backup-button style="-webkit-app-region: no-drag;"></app-backup-button>
  </div>
  <router-outlet />
</main>
