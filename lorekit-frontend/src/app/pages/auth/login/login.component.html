<main class="flex h-screen items-center justify-center bg-zinc-950 px-4">

    <div class="mb-6 text-center">
      <img src="assets/lorekit-logo.png" alt="Lorekit" class="mx-auto mb-4 h-12 w-12" />
      <h1 class="text-xl font-semibold text-white">Entrar no Lorekit</h1>
      <p class="mt-2 text-xs leading-5 text-zinc-400">

      </p>

    <app-account-login-form (authenticated)="authenticated()" />
