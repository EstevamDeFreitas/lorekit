@if (url(); as image) {
  @if (avatar()) {
    <button
      type="button"
      class="image-button avatar"
      (click)="open()"
      [attr.aria-label]="'Ampliar: ' + description()"
    >
      <img [src]="image" [alt]="description()" loading="lazy" />
    </button>
  } @else {
    <div class="image-frame">
      <button
        type="button"
        class="image-button"
        (click)="open()"
        [attr.aria-label]="'Ampliar: ' + description()"
      >
        <img [src]="image" [alt]="description()" loading="lazy" />
      </button>
    </div>
  }
  <dialog #viewer (click)="backdrop($event)" [attr.aria-label]="description()">
    <button
      type="button"
      class="close"
      (click)="close()"
      aria-label="Fechar imagem"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i></button
    ><img [src]="image" [alt]="description()" />
  </dialog>
} @else {
  @if (avatar()) {
    <span class="image-unavailable avatar" [attr.title]="description()">
      <i class="fa-solid fa-user" aria-hidden="true"></i>
    </span>
  } @else {
    <div class="image-frame" [attr.aria-busy]="visible() && !loadFailed()">
      <span class="image-unavailable" [attr.title]="description()">
        @if (loadFailed()) {
          Imagem indisponível neste dispositivo.
        } @else if (visible()) {
          Carregando imagem…
        } @else {
          A imagem será carregada ao chegar aqui.
        }
      </span>
    </div>
  }
}
