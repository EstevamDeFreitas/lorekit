@if (binding()) {<section class="event-dates"><app-calendar-date-picker [binding]="binding()" [value]="start()" [allowTime]="true" label="Início" (valueChange)="update('start', $event)" (invalid)="validityChange.emit($event)"></app-calendar-date-picker><app-calendar-date-picker [binding]="binding()" [value]="end()" [allowTime]="true" label="Fim (igual ao início para uma ocorrência)" (valueChange)="update('end', $event)" (invalid)="validityChange.emit($event)"></app-calendar-date-picker>@if (error()) {<p role="alert">{{ error() }}</p>}</section>}
