<app-icon-button
  buttonType="white"
  icon="fa-solid fa-sliders"
  [size]="size()"
  [title]="title()"
  (click)="togglePanel()">
</app-icon-button>

@if (isOpen()) {
  <button
    type="button"
    class="entity-lateral-menu-button__backdrop"
    title="Fechar campos"
    (click)="closePanel()">
  </button>

  <aside cdkTrapFocus [cdkTrapFocusAutoCapture]="true" class="entity-lateral-menu-button__panel" role="dialog" aria-modal="true" [attr.aria-labelledby]="panelTitleId" [style.width.px]="panelWidth()" (keydown.escape)="closePanel()">
    <div class="entity-lateral-menu-button__header">
      <span [id]="panelTitleId" class="entity-lateral-menu-button__title">Campos</span>
      <app-icon-button
        buttonType="secondaryActive"
        icon="fa-solid fa-xmark"
        size="base"
        title="Fechar campos"
        (click)="closePanel()">
      </app-icon-button>
    </div>

    <div class="entity-lateral-menu-button__content scrollbar-dark">
      <app-entity-lateral-menu
        [fields]="fields()"
        [entityTable]="entityTable()"
        [entityId]="entityId()"
        (onSave)="handleSave($event)">
      </app-entity-lateral-menu>
    </div>
  </aside>
}
