<section class="flex h-full min-h-0 flex-col overflow-hidden rounded-lg border border-zinc-800 bg-zinc-925">
  <header class="flex items-center justify-between gap-2 border-b border-zinc-700 bg-zinc-800 px-3 py-1.5">
    <span class="truncate text-xs text-zinc-300">{{ label() }}</span>
    <div class="w-fit shrink-0">
      <app-button
        label="Gerenciar"
        icon="fa-images"
        buttonType="secondary"
        size="xs"
        (click)="openGallery()">
      </app-button>
    </div>
  </header>

  <div
    class="group relative min-h-0 flex-1 overflow-hidden bg-zinc-950">
    @if (activeImage(); as image) {
      <img
        [src]="imageUrl(image)"
        [alt]="label()"
        class="h-full w-full cursor-zoom-in object-cover"
        (click)="openImageViewer()">

      @if (images().length > 1) {
        <div class="absolute inset-x-2 top-1/2 flex -translate-y-1/2 items-center justify-between opacity-0 transition-opacity group-hover:opacity-100">
          <app-icon-button
            icon="fa-solid fa-chevron-left"
            title="Imagem anterior"
            buttonType="secondary"
            (click)="previousImage($event)">
          </app-icon-button>
          <app-icon-button
            icon="fa-solid fa-chevron-right"
            title="Próxima imagem"
            buttonType="secondary"
            (click)="nextImage($event)">
          </app-icon-button>
        </div>

        <div class="absolute inset-x-0 bottom-2 flex items-center justify-center gap-1.5">
          @for (path of images(); track path; let index = $index) {
            <button
              type="button"
              class="h-1.5 rounded-full bg-white transition-all"
              [class.w-4]="index === activeIndex()"
              [class.w-1.5]="index !== activeIndex()"
              [class.opacity-100]="index === activeIndex()"
              [class.opacity-40]="index !== activeIndex()"
              [attr.aria-label]="'Exibir imagem ' + (index + 1)"
              (click)="selectImage(index, $event)">
            </button>
          }
        </div>

        <span class="absolute right-2 top-2 rounded bg-black/70 px-1.5 py-0.5 text-[10px] text-zinc-200">
          {{ activeIndex() + 1 }} / {{ images().length }}
        </span>
      }
    } @else {
      <div class="flex h-full min-h-24 flex-col items-center justify-center gap-2 text-zinc-500">
        <i class="fa-regular fa-images text-2xl"></i>
        <span class="text-xs">Nenhuma imagem</span>
        <span class="text-[10px] text-zinc-600">Use Gerenciar para adicionar</span>
      </div>
    }
  </div>
</section>
