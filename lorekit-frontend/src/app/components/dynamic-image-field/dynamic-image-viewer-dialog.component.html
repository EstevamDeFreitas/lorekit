<section class="flex h-[min(92vh,56rem)] w-[min(94vw,90rem)] max-w-full flex-col overflow-hidden rounded-lg border border-zinc-800 bg-zinc-950 text-zinc-100 shadow-2xl">
  <header class="flex items-center justify-between gap-3 border-b border-zinc-800 bg-zinc-900 px-4 py-2">
    <h2 class="truncate text-sm font-medium">{{ data.title }}</h2>
    <app-icon-button
      icon="fa-solid fa-xmark"
      title="Fechar"
      buttonType="secondary"
      (click)="close()">
    </app-icon-button>
  </header>

  <div class="flex min-h-0 flex-1 items-center justify-center bg-black p-4">
    <img
      [src]="data.imageUrl"
      [alt]="data.title"
      class="max-h-full max-w-full object-contain">
  </div>
</section>
